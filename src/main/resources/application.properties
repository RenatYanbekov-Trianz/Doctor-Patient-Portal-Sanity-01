# Doctor-Patient Portal - Cloud Configuration
# All sensitive values are externalized via environment variables or AWS Secrets Manager
# This file contains only non-sensitive defaults following 12-factor app principles

# ============================================================
# Server Configuration
# ============================================================
# Override with PORT environment variable in cloud deployment
server.port=${PORT:8080}

# ============================================================
# Database Configuration (cr-java-0073, cr-java-0097)
# Credentials retrieved from AWS Secrets Manager (cr-java-0113)
# DB_URL should point to Amazon RDS Proxy endpoint for connection pooling
# ============================================================
# DB_URL=jdbc:mysql://<rds-proxy-endpoint>:3306/hospital
# DB_USERNAME=<from-secrets-manager>
# DB_PASSWORD=<from-secrets-manager>
# DB_SECRET_NAME=hms/database/credentials

# HikariCP Connection Pool Settings
db.pool.max.size=${DB_POOL_MAX_SIZE:10}
db.pool.min.idle=${DB_POOL_MIN_IDLE:2}

# ============================================================
# Redis / Amazon ElastiCache Configuration (cr-java-0065)
# Spring Session stores HTTP sessions in Redis for distributed
# session management across horizontally scaled instances
# ============================================================
# REDIS_HOST=<elasticache-endpoint>
# REDIS_PORT=6379
# REDIS_PASSWORD=<auth-token>
spring.session.store-type=redis
spring.session.timeout=1800

# ============================================================
# AWS Configuration
# ============================================================
# AWS_REGION=us-east-1
# DB_SECRET_NAME=hms/database/credentials

# ============================================================
# Logging Configuration
# ============================================================
logging.level.com.hms=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
